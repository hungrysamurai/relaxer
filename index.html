<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.css" />
  <link rel="stylesheet" href="./src/style.css" />
  <title>Relaxer</title>
</head>

<body>
  <div class="custom-mode-overlay">
    <button class="custom-mode-overlay-close-btn">
      <i class="fa-solid fa-times"></i>
    </button>

    <form class="custom-mode-inputs-container">
      <div class="input-container">
        <input type="number" placeholder="00" id="breath-1" min="0" max="20">
        <label for="breath-1">Вдох</label>
      </div>
      <div class="input-container">
        <input type="number" placeholder="00" id="hold-1" min="0" max="20">
        <label for="hold-1">Задержка</label>
      </div>
      <div class="input-container">
        <input type="number" placeholder="00" id="breath-2" min="0" max="20">
        <label for="breath-2">Выдох</label>
      </div>
      <div class="input-container">
        <input type="number" placeholder="00" id="hold-2" min="0" max="20">
        <label for="hold-2">Задержка</label>
      </div>
    </form>

    <div class="custom-mode-btns-container">
      <button class="submit-custom-mode-btn">
        <i class="fa-solid fa-check"></i>
      </button>
      <button class="reset-custom-mode-btn">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </div>

  <div id="top-container">
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="4-7-8">4-7-8</button>
      <button class="mode-btn" data-mode="4-4-4-4">4-4-4-4</button>

      <button class="mode-btn custom-mode-btn disable"></button>
    </div>

    <button class="custom-mode-overlay-open-btn">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <canvas id="granim-canvas"></canvas>

  <div id="circle-container">
    <div id="inner-circle"></div>

    <div id="outer-circle"></div>

    <div id="pointer-container">
      <span id="pointer"></span>
    </div>

    <p id="text"></p>
  </div>

  <div class="footer">
    <div class="color-controls-container folded"></div>

    <div class="animation-controls">
      <button id="animation-control-btn">
        <i class="fa-solid fa-play"></i>
      </button>
    </div>

    <div class="soundbutton paused">
      <img src="./src/assets/sound.gif" alt="Alt" />
    </div>
    <audio class="audio" src="./src/assets/meditative-rain.mp3" loop></audio>
  </div>

  <script type="module" src="./src/script.ts"></script>
</body>

</html>
